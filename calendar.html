<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Təqvim • RSI Panel</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0 auto; max-width: 640px; font-family: -apple-system, "Segoe UI", Arial, sans-serif; background: #ffffff; color: #1a2b23; padding: 16px 14px 28px; }
  h1 { font-size: 20px; margin: 4px 0 2px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .logo { width: 10px; height: 10px; border-radius: 3px; background: #0b8a7d; display: inline-block; }
  .sub { color: #6b7f74; font-size: 13px; margin-bottom: 12px; }
  .nav { display: flex; gap: 6px; margin: 10px 0; }
  .nav a { flex: 1; text-align: center; padding: 10px 2px; background: #ffffff; border: 1px solid #e5ebe7; border-radius: 10px; color: #1a2b23; text-decoration: none; font-size: 13px; }
  .nav a.on { background: #0b8a7d; border-color: #0b8a7d; color: #ffffff; font-weight: 600; }
  .card { background: #ffffff; border: 1px solid #e5ebe7; border-radius: 12px; padding: 12px; margin-bottom: 8px; display: flex; gap: 12px; align-items: center; }
  .card.past { opacity: .45; }
  .card.today { border-color: #0b8a7d; border-width: 2px; }
  .date { min-width: 52px; text-align: center; background: #f5f8f6; border-radius: 10px; padding: 8px 4px; }
  .date b { display: block; font-size: 20px; }
  .date small { color: #6b7f74; font-size: 11px; }
  .info b { display: block; font-size: 15px; margin-bottom: 2px; }
  .info small { color: #6b7f74; font-size: 13px; line-height: 1.5; }
  .left { margin-left: auto; font-size: 13px; font-weight: 600; color: #0b8a7d; white-space: nowrap; }
  .foot { color: #6b7f74; font-size: 12px; margin-top: 14px; line-height: 1.6; border-top: 1px solid #e5ebe7; padding-top: 10px; }
</style>
</head>
<body>
<h1><span class="logo"></span>Təqvim</h1>
<div class="sub">Marketə təsir edən hadisələr • Vaxtlar Bakı ilə</div>
<div class="nav">
  <a href="index.html">Home</a>
  <a href="signals.html">Siqnallar</a>
  <a href="calendar.html" class="on">Təqvim</a>
  <a href="tactics.html">Taktikalar</a>
</div>
<div id="list"><div class="card">Yüklənir...</div></div>
<div class="foot">Yeni hadisə əlavə etmək üçün de — araşdırıb salıram.</div>

<script>
const MO = ["yan","fev","mar","apr","may","iyn","iyl","avq","sen","okt","noy","dek"];
async function main(){
  const el = document.getElementById("list");
  try{
    const r = await fetch("events.json");
    const j = await r.json();
    const evs = j.events.slice().sort((a,b)=> a.date < b.date ? -1 : 1);
    const now = new Date(); now.setHours(0,0,0,0);
    el.innerHTML = "";
    evs.forEach(e=>{
      const d = new Date(e.date + "T00:00:00");
      const diff = Math.round((d - now)/86400000);
      const label = diff < 0 ? "keçib" : diff === 0 ? "BU GÜN" : diff === 1 ? "sabah" : diff + " gün";
      const cls = diff < 0 ? "card past" : diff === 0 ? "card today" : "card";
      const div = document.createElement("div");
      div.className = cls;
      div.innerHTML = `<div class="date"><b>${d.getDate()}</b><small>${MO[d.getMonth()]}</small></div>` +
        `<div class="info"><b>${e.title}</b><small>${e.detail||""}</small></div>` +
        `<div class="left">${label}</div>`;
      el.appendChild(div);
    });
  }catch(e){
    el.innerHTML = `<div class="card">Təqvim yüklənmədi.</div>`;
  }
}
main();
</script>
</body>
</html>
