<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siqnallar 75+ / 30- • RSI Panel</title>
<style>
  :root, body { --bg:#0b100e; --card:#121915; --line:#1f2b24; --txt:#eaf2ed; --mut:#8aa095; --box:#0d1411; --acc:#2dd4bf; --accTxt:#04302a; --shadow:0 2px 12px rgba(0,0,0,.35); }
  body.light { --bg:#ffffff; --card:#f4f7f5; --line:#dfe7e2; --txt:#10201a; --mut:#5e7268; --box:#ffffff; --acc:#0b8a7d; --accTxt:#ffffff; --shadow:0 1px 6px rgba(16,32,26,.08); }
  * { box-sizing: border-box; }
  body { margin: 0 auto; max-width: 680px; font-family: -apple-system, "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--txt); padding: 14px 14px 24px; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 21px; margin: 6px 0 2px; letter-spacing: .2px; display: flex; align-items: center; gap: 8px; }
  .logo { width: 12px; height: 12px; border-radius: 4px; background: var(--acc); display: inline-block; }
  #themeBtn { background: var(--card); border: 1px solid var(--line); border-radius: 50%; width: 38px; height: 38px; color: var(--txt); padding: 0; display: flex; align-items: center; justify-content: center; }
  .sub { color: var(--mut); font-size: 13px; margin-bottom: 10px; }
  .nav { display: flex; gap: 8px; margin: 10px 0; }
  .nav a { flex: 1; text-align: center; padding: 11px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; color: var(--txt); text-decoration: none; font-size: 15px; transition: opacity .15s; }
  .nav a.on { background: var(--acc); border-color: var(--acc); color: var(--accTxt); font-weight: bold; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 13px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .card.hot { border-color: #ff6b6b; }
  .card.cold { border-color: #51cf66; }
  body.light .card.cold { border-color: #2f9e44; }
  .row1 { display: flex; justify-content: space-between; align-items: center; }
  .sym { font-weight: bold; font-size: 17px; letter-spacing: .2px; }
  .price { font-size: 15px; color: var(--acc); font-weight: bold; font-variant-numeric: tabular-nums; }
  .badge { display: inline-block; margin-top: 8px; margin-right: 6px; padding: 5px 11px; border-radius: 20px; font-size: 13px; font-weight: bold; }
  .badge.hot { background: transparent; color: #ff6b6b; border: 1px solid #ff6b6b; }
  .badge.cold { background: transparent; color: #2f9e44; border: 1px solid #51cf66; }
  body.light .badge.cold { border-color: #2f9e44; }
  .empty { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px; text-align: center; color: var(--mut); box-shadow: var(--shadow); }
  .foot { color: var(--mut); font-size: 12px; margin-top: 14px; line-height: 1.6; border-top: 1px solid var(--line); padding-top: 10px; }
  #status { display: inline-block; font-size: 13px; color: var(--mut); margin: 6px 0; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 6px 12px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--acc); margin-right: 6px; }
  button.ghost { padding: 11px 15px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); color: var(--txt); font-size: 15px; width: 100%; margin-top: 4px; transition: transform .1s, opacity .15s; }
  button:active { opacity: .75; transform: scale(.97); }
</style>
</head>
<body>
<script>try{if(localStorage.getItem("rsi_theme")==="light")document.body.classList.add("light");}catch(e){}</script>
<div class="top">
  <h1><span class="logo"></span>Siqnallar</h1>
  <button id="themeBtn" onclick="toggleTheme()" title="Dark / White">
    <svg id="icoMoon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg id="icoSun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</div>
<div class="sub">Yalnız ekstrem: RSI ≥75 (qızmış) və ya ≤30 (soyulmuş) • 1H / 4H</div>
<div class="nav">
  <a href="index.html">Home</a>
  <a href="signals.html" class="on">Siqnallar 75+ / 30-</a>
</div>
<div id="status"><span class="dot"></span>Yüklənir...</div>
<button class="ghost" onclick="refresh(true)">Yenilə</button>
<div style="height:10px"></div>
<div id="list"></div>

<div class="foot">
  Home-dakı siyahıdan coin əlavə/sil edəndə bura da aiddir (eyni siyahı).<br>
  Data: Bybit public API. Tövsiyə deyil.
</div>

<script>
const VER = "v3";
const DEFAULTS = ["BTCUSDT","ETHUSDT","SOLUSDT","BNBUSDT","XRPUSDT","DOGEUSDT","ADAUSDT","AVAXUSDT","LINKUSDT","SUIUSDT","ZECUSDT","1000PEPEUSDT","NEARUSDT","AAPLUSDT","HYPEUSDT","SOXLUSDT","ENAUSDT","XAUUSDT","TAOUSDT","AKEUSDT","CLUSDT","ARBUSDT","ONDOUSDT","SNDKUSDT","UNIUSDT","WLDUSDT","WIFUSDT","ZETAUSDT","FARTCOINUSDT","AAVEUSDT","PUMPFUNUSDT","LTCUSDT","MUBARAKUSDT","USELESSUSDT","XPLUSDT","PENGUUSDT","XAGUSDT","TRUMPUSDT","SPCXUSDT","XMRUSDT","XLMUSDT","MSTRUSDT","XAUTUSDT","HBARUSDT","VVVUSDT","BTWUSDT","APTUSDT","SKHYUSDT","CRCLUSDT","SKHYNIXUSDT","PONSUSDT","UAIUSDT","BCHUSDT","MUUSDT","INJUSDT","KORUUSDT","INTCUSDT","1000BONKUSDT","GRASSUSDT","SHIB1000USDT","SEIUSDT","ASTERUSDT","OPUSDT","LITUSDT","KERNELUSDT","DASHUSDT","SNXXUSDT","LSKUSDT","WLFIUSDT","MARSCOINUSDT","STRKUSDT","4STOCKUSDT","BZUSDT","VIRTUALUSDT","CRVUSDT","AEROUSDT","FILUSDT","ZAMAUSDT","SPXUSDT","DOTUSDT","CASHCATUSDT","FORMUSDT","ICPUSDT","NVDAUSDT","METAUSDT","SAMSUNGUSDT","BRUSDT","PHAUSDT","AIOZUSDT","SAGAUSDT","TIAUSDT","TRXUSDT","TSLAUSDT","MNTUSDT","JUPUSDT","DGAIUSDT","SOXSUSDT","ALGOUSDT","MONUSDT","FLOCKUSDT","PENDLEUSDT","JTOUSDT","GRAMUSDT","ETHFIUSDT","SKRUSDT","NILUSDT","DRAMUSDT","PTBUSDT","ATOMUSDT","COTIUSDT"];
const TFS = {"1H":"60","4H":"240"};
const HI = 75, LO = 30;
const CHUNK = 15;
let symbols = [];
try {
  const saved = JSON.parse(localStorage.getItem("rsi_symbols"));
  if (localStorage.getItem("rsi_ver") === VER && Array.isArray(saved) && saved.length) symbols = saved;
  else symbols = [...DEFAULTS];
}
catch(e){ symbols = [...DEFAULTS]; }

function toggleTheme(){
  const light = document.body.classList.toggle("light");
  try{ localStorage.setItem("rsi_theme", light ? "light" : "dark"); }catch(e){}
  syncIcon();
}
function syncIcon(){
  const light = document.body.classList.contains("light");
  document.getElementById("icoMoon").style.display = light ? "none" : "";
  document.getElementById("icoSun").style.display = light ? "" : "none";
}
syncIcon();

function fmt(p){
  p = Number(p);
  if(p >= 1000) return p.toLocaleString("en-US",{maximumFractionDigits:1});
  if(p >= 100) return p.toFixed(2);
  if(p >= 1) return p.toFixed(3);
  return p.toFixed(5);
}
function rsi(closes, period=14){
  if(closes.length < period+1) return null;
  let g=[], l=[];
  for(let i=1;i<closes.length;i++){ let c=closes[i]-closes[i-1]; g.push(Math.max(c,0)); l.push(Math.max(-c,0)); }
  let ag = g.slice(0,period).reduce((a,b)=>a+b,0)/period;
  let al = l.slice(0,period).reduce((a,b)=>a+b,0)/period;
  if(al===0) return 100;
  for(let i=period;i<g.length;i++){ ag=(ag*(period-1)+g[i])/period; al=(al*(period-1)+l[i])/period; }
  if(al===0) return 100;
  let rs=ag/al; return 100-(100/(1+rs));
}
async function fetchCloses(sym, interval){
  const urls = [
    `https://api.bybit.com/v5/market/kline?category=linear&symbol=${sym}&interval=${interval}&limit=50`,
    `https://api.bybit.com/v5/market/kline?category=spot&symbol=${sym}&interval=${interval}&limit=50`
  ];
  for(const u of urls){
    try{
      const r = await fetch(u); const j = await r.json();
      if(j.retCode===0 && j.result && j.result.list && j.result.list.length>14){
        const rev = [...j.result.list].reverse();
        return rev.map(x=>Number(x[4]));
      }
    }catch(e){}
  }
  return null;
}
async function loadOne(sym){
  const out = {sym, price:null, r:{}};
  const res = await Promise.all(Object.entries(TFS).map(async ([label, iv]) => [label, await fetchCloses(sym, iv)]));
  for(const [label, c] of res){
    if(c){ out.price = c[c.length-1]; out.r[label]=rsi(c,14); }
    else out.r[label]=null;
  }
  return out;
}
function render(items){
  const el = document.getElementById("list"); el.innerHTML="";
  const hits = items.filter(o => Object.values(o.r).some(v => v!=null && (v>=HI || v<=LO)));
  if(!hits.length){
    el.innerHTML = `<div class="empty">Hazırda 75+ / 30- siqnal yoxdur.<br>60 saniyədən bir avtomatik yoxlanılır.</div>`;
    return;
  }
  hits.forEach(o=>{
    const tags = Object.entries(o.r)
      .filter(([k,v]) => v!=null && (v>=HI || v<=LO))
      .map(([k,v]) => v>=HI
        ? `<span class="badge hot">${k} ${v.toFixed(1)} • QIZMIŞ</span>`
        : `<span class="badge cold">${k} ${v.toFixed(1)} • SOYULMUŞ</span>`).join("");
    const isHot = Object.values(o.r).some(v => v!=null && v>=HI);
    const d = document.createElement("div");
    d.className = "card " + (isHot ? "hot" : "cold");
    d.innerHTML = `<div class="row1"><span class="sym">${o.sym}</span>`+
      `<span class="price">${o.price!=null?fmt(o.price):"-"}</span></div><div>${tags}</div>`;
    el.appendChild(d);
  });
}
let runId = 0, timer = null, count = 60;
async function refresh(manual){
  const my = ++runId;
  const st = document.getElementById("status");
  st.innerHTML = "<span class='dot'></span>Yüklənir 0/" + symbols.length + "...";
  const items = [];
  for(let i = 0; i < symbols.length; i += CHUNK){
    const part = await Promise.all(symbols.slice(i, i + CHUNK).map(loadOne));
    if(my !== runId) return;
    items.push(...part);
    st.innerHTML = "<span class='dot'></span>Yüklənir " + Math.min(i + CHUNK, symbols.length) + "/" + symbols.length + "...";
  }
  render(items);
  const t = new Date().toLocaleString("az-AZ",{timeZone:"Asia/Baku"});
  st.innerHTML = `<span class='dot'></span>Son yoxlama: ${t} • Növbəti: 60 saniyə`;
  count = 60;
  if(timer) clearInterval(timer);
  timer = setInterval(()=>{
    count--;
    if(count<=0){ refresh(false); }
    else st.innerHTML = `<span class='dot'></span>Son yoxlama: ${t} • Növbəti: ${count} saniyə`;
  },1000);
}
refresh(false);
</script>
</body>
</html>
