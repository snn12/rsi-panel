<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSI Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, -apple-system, "Segoe UI", Arial, sans-serif; background: #0B0E11; color: #F2F5F0; }
  .wrap { margin: 0 auto; max-width: 900px; padding: 0 12px 28px; }
  header.topbar { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 10px; background: #0B0E11; border-bottom: 2px solid #F7B500; padding: 10px 12px; }
  #burger { background: transparent; border: 1px solid #2A3342; border-radius: 10px; color: #F7B500; font-size: 20px; padding: 4px 11px; }
  #burger:active { opacity: .7; }
  .brand { font-weight: 800; font-size: 18px; letter-spacing: .3px; }
  .brand b { color: #F7B500; }
  .drawer { position: fixed; top: 0; left: -260px; width: 240px; height: 100%; background: #12161C; border-right: 1px solid #232B38; z-index: 100; transition: left .2s; padding: 16px 12px; }
  .drawer.open { left: 0; }
  .drawer h3 { margin: 4px 4px 10px; font-size: 13px; color: #8A94A6; text-transform: uppercase; letter-spacing: 1px; }
  .drawer a { display: block; padding: 11px 12px; border-radius: 10px; color: #F2F5F0; text-decoration: none; font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .drawer a.on { background: #F7B500; color: #111; }
  .drawer a:active { opacity: .8; }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 90; display: none; }
  .scrim.open { display: block; }
  .marquee { overflow: hidden; white-space: nowrap; background: #12161C; border-bottom: 1px solid #232B38; }
  .mtrack { display: inline-block; padding: 7px 0; animation: slide 40s linear infinite; font-size: 13px; font-variant-numeric: tabular-nums; }
  @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .mq { display: inline-block; margin: 0 14px; }
  .mq b { color: #F2F5F0; }
  .up { color: #16C784; } .down { color: #EA3943; } .flat { color: #8A94A6; }
  .toolbar { padding: 10px 0 4px; display: flex; gap: 8px; flex-wrap: wrap; }
  #search { flex: 1; min-width: 150px; padding: 10px 12px; border-radius: 12px; border: 1px solid #2A3342; background: #12161C; color: #F2F5F0; font-size: 15px; font-family: inherit; }
  #search:focus { outline: none; border-color: #F7B500; }
  .chips { display: flex; gap: 6px; padding: 6px 0; flex-wrap: wrap; }
  .chip { padding: 7px 12px; border-radius: 20px; border: 1px solid #2A3342; background: #12161C; color: #F2F5F0; font-size: 13px; font-weight: 600; font-family: inherit; }
  .chip.on { background: #F7B500; border-color: #F7B500; color: #111; }
  #status { font-size: 12px; color: #8A94A6; margin: 6px 0; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #16C784; margin-right: 6px; }
  .bar { display: flex; gap: 8px; margin: 8px 0; }
  #add { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 12px; border: 1px solid #2A3342; background: #12161C; color: #F2F5F0; font-size: 15px; font-family: inherit; }
  #add:focus { outline: none; border-color: #F7B500; }
  button.act { padding: 10px 14px; border-radius: 12px; border: 0; background: #16C784; color: #04120B; font-size: 14px; font-weight: 800; font-family: inherit; white-space: nowrap; }
  button.ghost { padding: 10px 14px; border-radius: 12px; background: #12161C; border: 1px solid #2A3342; color: #F2F5F0; font-size: 14px; font-weight: 600; font-family: inherit; white-space: nowrap; }
  button:active { opacity: .75; }
  .tblwrap { overflow-x: auto; border: 1px solid #232B38; border-radius: 14px; background: #12161C; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px; }
  thead th { text-align: left; font-size: 11px; color: #8A94A6; text-transform: uppercase; letter-spacing: .6px; padding: 10px 10px; border-bottom: 1px solid #232B38; position: sticky; top: 0; background: #12161C; }
  tbody td { padding: 9px 10px; border-bottom: 1px solid #1A212C; font-variant-numeric: tabular-nums; }
  tbody tr:last-child td { border-bottom: 0; }
  td.sym { font-weight: 700; }
  a.slink { color: #F2F5F0; text-decoration: none; }
  a.slink:active { color: #F7B500; }
  .mtag { font-size: 9px; font-weight: 700; color: #F7B500; border: 1px solid #F7B500; border-radius: 8px; padding: 1px 6px; vertical-align: 2px; margin-left: 4px; }
  td.num { font-weight: 700; }
  .rsi { display: inline-block; min-width: 40px; text-align: center; background: #1A212C; border-radius: 8px; padding: 3px 6px; font-weight: 700; }
  .ob { color: #EA3943; } .hot { color: #F7B500; } .ok { color: #8A94A6; } .cheap { color: #16C784; } .os { color: #16C784; }
  .vbadge { font-size: 10px; font-weight: 800; border-radius: 8px; padding: 3px 8px; white-space: nowrap; }
  .v-BUY { background: #16C784; color: #04120B; }
  .v-SELL { background: #EA3943; color: #fff; }
  .v-NEYTRAL { background: #1A212C; color: #8A94A6; }
  .iconbtn { background: transparent; border: 0; font-size: 17px; padding: 2px 5px; color: #5B6675; }
  .fav { color: #5B6675 !important; }
  .fav.on { color: #F7B500 !important; }
  .del { color: #EA3943; opacity: .55; }
  .morebtn { background: transparent; border: 0; color: #F7B500; font-size: 12px; font-weight: 700; padding: 2px 4px; font-family: inherit; }
  tr.morerow td { background: #0E1319; }
  .morebox { display: none; }
  .mrow { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; }
  .md-AL { color: #16C784; font-weight: 700; }
  .md-SAT { color: #EA3943; font-weight: 700; }
  .md-NEYTRAL { color: #5B6675; }
  .empty { padding: 24px; text-align: center; color: #8A94A6; }
  .foot { color: #5B6675; font-size: 12px; margin-top: 14px; line-height: 1.6; text-align: center; }
  .lightbox { position: fixed; inset: 0; z-index: 200; display: none; align-items: flex-end; justify-content: center; }
  .lightbox.open { display: flex; }
  .lb-scrim { position: absolute; inset: 0; background: rgba(0,0,0,.65); }
  .lb-card { position: relative; width: 100%; max-width: 560px; max-height: 85%; overflow-y: auto; background: #12161C; border: 1px solid #2A3342; border-bottom: 0; border-radius: 18px 18px 0 0; padding: 16px 16px 24px; }
  .lb-x { float: right; background: transparent; border: 0; color: #8A94A6; font-size: 20px; padding: 0 4px; }
  .lb-price { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; margin: 4px 0; }
  .krow { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid #1A212C; font-size: 14px; }
  .krow:first-of-type { border-top: 0; }
  .krow span:last-child { font-weight: 700; font-variant-numeric: tabular-nums; }
  .lb-go { display: block; text-align: center; margin-top: 12px; padding: 12px; border-radius: 12px; background: #F7B500; color: #111; font-weight: 800; text-decoration: none; }
</style>
</head>
<body>
<header class="topbar">
  <button id="burger" onclick="toggleDrawer()">☰</button>
  <div class="brand">RSI <b>Panel</b></div>
</header>
<nav class="drawer" id="drawer">
  <h3>Bölmələr</h3>
  <a href="index.html" class="on">Home</a>
  <a href="signals.html">Siqnallar</a>
  <a href="calendar.html">Təqvim</a>
  <a href="tactics.html">Taktikalar</a>
  <a href="skor.html">Skor</a>
  <a href="fav.html">Sevimli</a>
</nav>
<div class="scrim" id="scrim" onclick="toggleDrawer()"></div>

<div class="marquee"><div class="mtrack" id="mtrack"></div></div>

<div class="wrap">
  <div class="toolbar">
    <input id="search" placeholder="Axtar: BTC, SOL..." autocomplete="off">
  </div>
  <div class="chips" id="chips">
    <button class="chip" data-m="all">Hamısı</button>
    <button class="chip" data-m="crypto">Crypto</button>
    <button class="chip" data-m="stock">Stocks</button>
    <button class="chip" data-m="com">Əmtəə</button>
  </div>
  <div id="status"><span class="dot"></span>Yüklənir...</div>

  <div class="bar">
    <input id="add" placeholder="Məs: ARBUSDT" autocapitalize="characters">
    <button class="act" onclick="addSym()">+ Əlavə et</button>
    <button class="ghost" onclick="refresh(true)">Yenilə</button>
  </div>

  <div class="tblwrap">
    <table>
      <thead><tr><th>#</th><th>Coin</th><th>Qiymət</th><th>5D</th><th>1H</th><th>4H</th><th>Hökm</th><th></th></tr></thead>
      <tbody id="list"></tbody>
    </table>
  </div>

  <div class="foot">Qiymət rəngi 5-dəqiqəlik istiqamətdir • Coin-ə bas — lightbox açılır • Tövsiyə deyil</div>
</div>

<div class="lightbox" id="lb">
  <div class="lb-scrim" onclick="closeLb()"></div>
  <div class="lb-card">
    <button class="lb-x" onclick="closeLb()">×</button>
    <div id="lb-body">...</div>
    <a class="lb-go" id="lb-go" href="#">Tam analiz →</a>
  </div>
</div>

<script>
const VER = "v4";
const DEFAULTS = ["BTCUSDT","ETHUSDT","SOLUSDT","BNBUSDT","XRPUSDT","DOGEUSDT","ADAUSDT","AVAXUSDT","LINKUSDT","SUIUSDT","ZECUSDT","NEARUSDT","HYPEUSDT","SOXLUSDT","BCHUSDT","UNIUSDT","CLUSDT","1000PEPEUSDT","ENAUSDT","ARBUSDT","XAUUSDT","MUBARAKUSDT","LTCUSDT","TAOUSDT","WLDUSDT","PENGUUSDT","ONDOUSDT","SNDKUSDT","AKEUSDT","AAVEUSDT","TRUMPUSDT","FARTCOINUSDT","PUMPFUNUSDT","ZROUSDT","TSLAUSDT","XAGUSDT","USELESSUSDT","XLMUSDT","XPLUSDT","PONSUSDT","1000BONKUSDT","LITUSDT","APTUSDT","KORUUSDT","INJUSDT","TIAUSDT","MARSCOINUSDT","NILUSDT","HBARUSDT","OPUSDT","MUUSDT","DASHUSDT","AAPLUSDT","MSTRUSDT","XMRUSDT","XAUTUSDT","VIRTUALUSDT","SKHYNIXUSDT","WIFUSDT","SAMSUNGUSDT","ASTERUSDT","SKHYUSDT","ICPUSDT","SPCXUSDT","METUSDT","BTWUSDT","DOTUSDT","VVVUSDT","FILUSDT","AEROUSDT","MONUSDT","CRCLUSDT","B3USDT","CASHCATUSDT","DRAMUSDT","ALLOUSDT","WLFIUSDT","CRVUSDT","MNTUSDT","SHIB1000USDT","SAGAUSDT","LSKUSDT","ETCUSDT","STRKUSDT","BRUSDT","ETHFIUSDT","SEIUSDT","GRAMUSDT","SPXUSDT","NVDAUSDT","RAYDIUMUSDT","SNXXUSDT","DRIFTUSDT","ATOMUSDT","BZUSDT","ZAMAUSDT","LONGXIAUSDT","POLUSDT","GRASSUSDT","JUPUSDT","FLOCKUSDT","PENDLEUSDT","LDOUSDT","METAUSDT","BSVUSDT","FOLKSUSDT","KAITOUSDT","JTOUSDT","4STOCKUSDT","KERNELUSDT","MORPHOUSDT","TQQQUSDT","FIGHTUSDT","INTCUSDT","COTIUSDT","SOXSUSDT","BLASTUSDT","GOOGLUSDT","SKYUSDT","NIULAIUSDT","SUPERUSDT","EIGENUSDT","ALGOUSDT","TRXUSDT","ZETAUSDT","B2USDT","RENDERUSDT","ZENUSDT","GALAUSDT","ACEUSDT","STXUSDT","CHIPUSDT","KASUSDT","POPCATUSDT","PLUMEUSDT","APEUSDT","ENSUSDT","PYTHUSDT","HNTUSDT","UAIUSDT","MINAUSDT","STONKUSDT","SANDUSDT","BROCCOLIUSDT","ARUSDT","CHRUSDT","CAKEUSDT","HUSDT","GRTUSDT","EWYUSDT","AXSUSDT","NBISUSDT","CAPUSDT","WAVESUSDT","KITEUSDT","0GUSDT","4USDT","ATHUSDT","EGLDUSDT","1000FLOKIUSDT","SUSHIUSDT","VETUSDT","SENTUSDT","FFUSDT","PAXGUSDT","CROUSDT","ORDIUSDT","QQQUSDT","BEATUSDT","AMZNUSDT","FLOWUSDT","STGUSDT","DGAIUSDT","PIEVERSEUSDT","GIGGLEUSDT","CCUSDT","SUSDT","BOMEUSDT","DELLUSDT","PTBUSDT","MSFTUSDT","LAUSDT","TUTUSDT","MOODENGUSDT","MRVLUSDT","CPUSDT","BANKUSDT","OPNUSDT","LUNA2USDT","ZKUSDT","1000NEIROCTOUSDT","SKRUSDT","ORCAUSDT","MYXUSDT","PLTRUSDT","SYRUPUSDT","AVGOUSDT","IOSTUSDT","ARCUSDT","LABUSDT"];
const TFS = {"1H":"60","4H":"240"};
const CHUNK = 15;
const MARKETS = {stock:["AAPLUSDT","NVDAUSDT","TSLAUSDT","METAUSDT","MSTRUSDT","INTCUSDT","MUUSDT","SNDKUSDT","SKHYNIXUSDT","SAMSUNGUSDT","SOXLUSDT","SOXSUSDT","GOOGLUSDT","AMZNUSDT","MSFTUSDT","QQQUSDT","DELLUSDT","MRVLUSDT","AVGOUSDT","PLTRUSDT","NBISUSDT","TQQQUSDT","EWYUSDT"], com:["XAUUSDT","XAGUSDT","XAUTUSDT","PAXGUSDT"]};
function marketOf(s){ if(MARKETS.stock.includes(s)) return "stock"; if(MARKETS.com.includes(s)) return "com"; return "crypto"; }
let mkts = [];
try{ mkts = JSON.parse(localStorage.getItem("rsi_mkts")) || []; }catch(e){}
let searchTxt = "";
let symbols = [];
function save(){ try{ localStorage.setItem("rsi_symbols", JSON.stringify(symbols)); localStorage.setItem("rsi_ver", VER); }catch(e){} }
try {
  const saved = JSON.parse(localStorage.getItem("rsi_symbols"));
  if (localStorage.getItem("rsi_ver") === VER && Array.isArray(saved) && saved.length) symbols = saved;
  else { symbols = [...DEFAULTS]; save(); }
}
catch(e){ symbols = [...DEFAULTS]; }
let favs = [];
try{ favs = JSON.parse(localStorage.getItem("rsi_favs")) || []; }catch(e){}
function isFav(s){ return favs.includes(s); }
function saveFavs(){ try{ localStorage.setItem("rsi_favs", JSON.stringify(favs)); }catch(e){} }
function toggleFav(s){ if(isFav(s)) favs=favs.filter(x=>x!==s); else favs.push(s); saveFavs(); render(lastItems); }
let lastItems = [];

function toggleDrawer(){
  document.getElementById("drawer").classList.toggle("open");
  document.getElementById("scrim").classList.toggle("open");
}
function fmt(p){
  p = Number(p);
  if(p >= 1000) return p.toLocaleString("en-US",{maximumFractionDigits:1});
  if(p >= 100) return p.toFixed(2);
  if(p >= 1) return p.toFixed(3);
  return p.toFixed(5);
}
function cls(r){
  if(r==null) return "ok";
  if(r>=70) return "ob"; if(r>=60) return "hot";
  if(r>40) return "ok"; if(r>30) return "cheap"; return "os";
}
function rsi(closes, period=14){
  if(closes.length < period+1) return null;
  let g=[], l=[];
  for(let i=1;i<closes.length;i++){ let c=closes[i]-closes[i-1]; g.push(Math.max(c,0)); l.push(Math.max(-c,0)); }
  let ag = g.slice(0,period).reduce((a,b)=>a+b,0)/period;
  let al = l.slice(0,period).reduce((a,b)=>a+b,0)/period;
  if(al===0) return 100;
  for(let i=period;i<g.length;i++){ ag=(ag*(period-1)+g[i])/period; al=(al*(period-1)+l[i])/period; }
  if(al===0) return 100;
  let rs=ag/al; return 100-(100/(1+rs));
}
function emaArr(src,p){
  const k=2/(p+1); const o=new Array(src.length).fill(null);
  let e=src.slice(0,p).reduce((a,b)=>a+b,0)/p; o[p-1]=e;
  for(let i=p;i<src.length;i++){e=src[i]*k+e*(1-k);o[i]=e;}
  return o;
}
function macdHist(c){
  const e12=emaArr(c,12), e26=emaArr(c,26);
  const mv=e12.map((v,i)=>v==null||e26[i]==null?null:v-e26[i]).filter(v=>v!=null);
  const se=emaArr(mv,9);
  return mv[mv.length-1]-se[se.length-1];
}
function pctBv(c){
  const s=c.slice(-20); const m=s.reduce((a,b)=>a+b,0)/20;
  const sd=Math.sqrt(s.reduce((a,b)=>a+(b-m)*(b-m),0)/20);
  return (c[c.length-1]-(m-2*sd))/(4*sd);
}
async function fetchK(symbol, interval, limit=50){
  const urls = [
    `https://api.bybit.com/v5/market/kline?category=linear&symbol=${symbol}&interval=${interval}&limit=${limit}`,
    `https://api.bybit.com/v5/market/kline?category=spot&symbol=${symbol}&interval=${interval}&limit=${limit}`
  ];
  for(const u of urls){
    try{
      const r = await fetch(u); const j = await r.json();
      if(j.retCode===0 && j.result && j.result.list && j.result.list.length>5){
        return [...j.result.list].reverse().map(x=>Number(x[4]));
      }
    }catch(e){}
  }
  return null;
}
function miniVerdict(r4, price, c4){
  if(r4==null || !c4 || !c4.length) return null;
  const e50=emaArr(c4,50).pop();
  const mh=macdHist(c4), pb=pctBv(c4);
  const L=[];
  const put=(id,d)=>L.push({id,d});
  put("T1", r4>=75?"SAT":r4<=20?"AL":"NEYTRAL");
  put("T2", r4>55?"AL":r4<45?"SAT":"NEYTRAL");
  put("T4", price>e50?"AL":price<e50?"SAT":"NEYTRAL");
  put("T6", mh>0?"AL":mh<0?"SAT":"NEYTRAL");
  put("T7", pb>0.8?"SAT":pb<0.2?"AL":"NEYTRAL");
  const al=L.filter(x=>x.d==="AL").length, sat=L.filter(x=>x.d==="SAT").length;
  return{al,sat,list:L,verdict:al-sat>=2?"BUY":sat-al>=2?"SELL":"NEYTRAL"};
}
async function loadOne(sym){
  const [c1, c4, c5] = await Promise.all([
    fetchK(sym,"60"), fetchK(sym,"240"), fetchK(sym,"5",8)
  ]);
  const out = {sym, price:null, r:{}, v:null, d5:null};
  if(c1){ out.price=c1[c1.length-1]; out.r["1H"]=rsi(c1,14); }
  if(c4){ out.r["4H"]=rsi(c4,14); out.v=miniVerdict(out.r["4H"], out.price, c4); }
  if(c5 && c5.length>=6){
    const a=c5[c5.length-6], b=c5[c5.length-1];
    const ch=(b-a)/a*100;
    out.d5 = ch;
    out.d5d = ch>0.05?1:ch<-0.05?-1:0;
  }
  return out;
}
function dirCls(d){ return d===1?"up":d===-1?"down":"flat"; }
function render(items){
  lastItems = items || [];
  renderMarquee(lastItems);
  const el = document.getElementById("list"); el.innerHTML="";
  const q = searchTxt.trim().toUpperCase();
  const shown = lastItems.filter(o =>
    (mkts.length===0 || mkts.includes(marketOf(o.sym))) &&
    (!q || o.sym.includes(q))
  );
  if(!shown.length){ el.innerHTML = `<tr><td colspan="8"><div class="empty">Nəticə yoxdur.</div></td></tr>`; return; }
  let html = "";
  shown.forEach((o,i)=>{
    const r1=o.r["1H"], r4=o.r["4H"];
    const m = marketOf(o.sym);
    const tag = m==="crypto" ? "" : `<span class="mtag">${m==="stock"?"STOCK":"ƏMTƏƏ"}</span>`;
    const v = o.v;
    const vb = v ? `<span class="vbadge v-${v.verdict}">${v.verdict}</span>` : "";
    const dc = o.d5==null ? `<span class="flat">—</span>` : `<span class="${dirCls(o.d5d)}">${o.d5>=0?"+":""}${o.d5.toFixed(2)}%</span>`;
    const mb = v ? `<tr class="morerow" id="more-${o.sym}" style="display:none"><td colspan="8"><div class="morebox" style="display:block;">${v.list.map(x=>`<div class="mrow"><span>${x.id}</span><span class="md-${x.d}">${x.d==="NEYTRAL"?"GÖZLƏ":x.d}</span></div>`).join("")}<div class="mrow"><span></span><a class="slink" href="coin.html?symbol=${o.sym}" style="color:#F7B500;font-weight:700;">Tam analiz →</a></div></div></td></tr>` : "";
    html += `<tr class="mainrow">`+
      `<td class="flat">${i+1}</td>`+
      `<td class="sym"><a class="slink" href="#" onclick="openLb('${o.sym}');return false;">${o.sym}</a>${tag}</td>`+
      `<td class="num ${dirCls(o.d5d)}">${o.price!=null?fmt(o.price):"-"}</td>`+
      `<td>${dc}</td>`+
      `<td><span class="rsi ${cls(r1)}">${r1!=null?r1.toFixed(0):"-"}</span></td>`+
      `<td><span class="rsi ${cls(r4)}">${r4!=null?r4.toFixed(0):"-"}</span></td>`+
      `<td>${vb} <button class="morebtn" onclick="toggleMore('${o.sym}')">More +</button></td>`+
      `<td><button class="iconbtn fav${isFav(o.sym)?" on":""}" onclick="toggleFav('${o.sym}')">★</button><button class="iconbtn del" onclick="delSym('${o.sym}')">×</button></td></tr>`+mb;
  });
  el.innerHTML = html;
}
function renderMarquee(items){
  const top = items.slice(0,30);
  const one = top.map(o=>{
    const c = o.d5==null?"flat":dirCls(o.d5d);
    return `<span class="mq"><b>${o.sym}</b> <span class="${c}">${o.price!=null?fmt(o.price):"-"}</span></span>`;
  }).join("");
  document.getElementById("mtrack").innerHTML = one + one;
}
function toggleMore(sym){
  const box = document.getElementById("more-"+sym);
  if(!box) return;
  const open = box.style.display==="table-row";
  box.style.display = open?"none":"table-row";
  event.target.textContent = open?"More +":"More −";
}
function openLb(sym){
  const o = lastItems.find(x=>x.sym===sym);
  if(!o) return;
  const r1=o.r["1H"], r4=o.r["4H"], v=o.v;
  const dc = o.d5==null ? "—" : `<span class="${dirCls(o.d5d)}">${o.d5>=0?"+":""}${o.d5.toFixed(2)}% / 25d</span>`;
  const vb = v ? `<span class="vbadge v-${v.verdict}">${v.verdict} ${v.al}-${v.sat}</span>` : "";
  const rows = v ? v.list.map(x=>`<div class="krow"><span>${x.id}</span><span class="md-${x.d}">${x.d==="NEYTRAL"?"GÖZLƏ":x.d}</span></div>`).join("") : "";
  document.getElementById("lb-body").innerHTML =
    `<div style="font-size:20px;font-weight:800;">${o.sym}</div>`+
    `<div class="lb-price ${dirCls(o.d5d)}">${o.price!=null?fmt(o.price):"-"}</div>`+
    `<div class="krow"><span>5D dəyişmə</span><span>${dc}</span></div>`+
    `<div class="krow"><span>RSI 1H / 4H</span><span>${r1!=null?r1.toFixed(1):"-"} / ${r4!=null?r4.toFixed(1):"-"}</span></div>`+
    `<div class="krow"><span>Hökm</span><span>${vb}</span></div>`+rows;
  document.getElementById("lb-go").href = "coin.html?symbol="+o.sym;
  document.getElementById("lb").classList.add("open");
}
function closeLb(){ document.getElementById("lb").classList.remove("open"); }
let runId = 0, timer = null, count = 60;
async function refresh(manual){
  const my = ++runId;
  const st = document.getElementById("status");
  st.innerHTML = "<span class='dot'></span>Yüklənir 0/" + symbols.length + "...";
  const items = [];
  for(let i = 0; i < symbols.length; i += CHUNK){
    const part = await Promise.all(symbols.slice(i, i + CHUNK).map(loadOne));
    if(my !== runId) return;
    items.push(...part);
    st.innerHTML = "<span class='dot'></span>Yüklənir " + Math.min(i + CHUNK, symbols.length) + "/" + symbols.length + "...";
  }
  render(items);
  const t = new Date().toLocaleString("az-AZ",{timeZone:"Asia/Baku"});
  st.innerHTML = `<span class='dot'></span>Son yeniləmə: ${t} • Növbəti: 60 saniyə`;
  count = 60;
  if(timer) clearInterval(timer);
  timer = setInterval(()=>{
    count--;
    if(count<=0){ refresh(false); }
    else st.innerHTML = `<span class='dot'></span>Son yeniləmə: ${t} • Növbəti: ${count} saniyə`;
  },1000);
}
function addSym(){
  const inp = document.getElementById("add");
  const v = inp.value.trim().toUpperCase().replace("/","").replace(" ","");
  if(!v) return;
  if(!symbols.includes(v)){ symbols.push(v); save(); }
  inp.value = "";
  refresh(true);
}
function delSym(s){ symbols=symbols.filter(x=>x!==s); save(); refresh(true); }
function syncChips(){
  document.querySelectorAll("#chips .chip").forEach(b=>{
    const m = b.dataset.m;
    const on = m==="all" ? mkts.length===0 : mkts.includes(m);
    b.classList.toggle("on", on);
  });
}
function setMkt(m){
  if(m==="all"){ mkts = []; }
  else if(mkts.includes(m)){ mkts = mkts.filter(x=>x!==m); }
  else { mkts.push(m); }
  try{ localStorage.setItem("rsi_mkts", JSON.stringify(mkts)); }catch(e){}
  syncChips(); render(lastItems);
}
document.querySelectorAll("#chips .chip").forEach(b => b.addEventListener("click", () => setMkt(b.dataset.m)));
document.getElementById("add").addEventListener("keydown",e=>{ if(e.key==="Enter") addSym(); });
document.getElementById("search").addEventListener("input",e=>{ searchTxt = e.target.value; render(lastItems); });
syncChips();
refresh(false);
</script>
