<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSI Panel</title>
<style>
  :root, body { --bg:#0e1512; --card:#151e1a; --line:#223029; --txt:#e9f0eb; --mut:#8fa398; --box:#0c120f; --acc:#2dd4bf; --accTxt:#052e29; --inp:#151e1a; }
  body.light { --bg:#eef2ee; --card:#ffffff; --line:#d8e2da; --txt:#15241d; --mut:#5f7268; --box:#f0f4f1; --acc:#0d9488; --accTxt:#ffffff; --inp:#ffffff; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Arial, sans-serif; background: var(--bg); color: var(--txt); padding: 12px; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 20px; margin: 6px 0 2px; }
  #themeBtn { background: var(--card); border: 1px solid var(--line); border-radius: 50%; width: 38px; height: 38px; color: var(--txt); font-size: 17px; padding: 0; }
  .sub { color: var(--mut); font-size: 13px; margin-bottom: 10px; }
  .nav { display: flex; gap: 8px; margin: 8px 0; }
  .nav a { flex: 1; text-align: center; padding: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; color: var(--txt); text-decoration: none; font-size: 15px; }
  .nav a.on { background: var(--acc); border-color: var(--acc); color: var(--accTxt); font-weight: bold; }
  .bar { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
  input { flex: 1; min-width: 140px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--inp); color: var(--txt); font-size: 16px; }
  button.act { padding: 10px 14px; border-radius: 10px; border: 0; background: var(--acc); color: var(--accTxt); font-size: 15px; font-weight: bold; }
  button.ghost { padding: 10px 14px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); color: var(--txt); font-size: 15px; }
  button:active { opacity: .75; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .row1 { display: flex; justify-content: space-between; align-items: center; }
  .sym { font-weight: bold; font-size: 17px; }
  .price { font-size: 15px; color: var(--acc); font-weight: bold; }
  .del { background: transparent; border: 0; color: #ff7b7b; font-size: 18px; padding: 4px 8px; }
  .grid { display: flex; gap: 8px; margin-top: 10px; }
  .tf { flex: 1; background: var(--box); border-radius: 8px; padding: 8px; text-align: center; }
  .tf small { color: var(--mut); display: block; margin-bottom: 4px; }
  .tf b { font-size: 18px; }
  .ob { color: #ff6b6b; } .hot { color: #ffa94d; } .ok { color: var(--mut); } .cheap { color: #2dd4bf; } .os { color: #51cf66; }
  .foot { color: var(--mut); font-size: 12px; margin-top: 12px; line-height: 1.5; }
  #status { font-size: 13px; color: var(--mut); margin: 6px 0; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--acc); margin-right: 6px; }
</style>
</head>
<body>
<script>try{if(localStorage.getItem("rsi_theme")==="light")document.body.classList.add("light");}catch(e){}</script>
<div class="top">
  <h1>RSI Panel</h1>
  <button id="themeBtn" onclick="toggleTheme()" title="Dark / White">
    <svg id="icoMoon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg id="icoSun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</div>
<div class="sub">Bybit canlı data • RSI-14 • 1H / 4H</div>
<div class="nav">
  <a href="index.html" class="on">Home</a>
  <a href="signals.html">Siqnallar 75+ / 30-</a>
</div>
<div id="status"><span class="dot"></span>Yüklənir...</div>

<div class="bar">
  <input id="add" placeholder="Məs: ARBUSDT" autocapitalize="characters">
  <button class="act" id="addBtn" onclick="addSym()">+ Əlavə et</button>
  <button class="ghost" onclick="refresh(true)">Yenilə</button>
</div>

<div id="list"></div>

<div class="foot">
  Qırmızı ≥70 overbought, Yaşıl ≤30 oversold.<br>
  Ekstrem siqnallar (≥75 / ≤30) üçün <b>Siqnallar</b> səhifəsinə bax.<br>
  Data: Bybit public API. Tövsiyə deyil.
</div>

<script>
const VER = "v3";
const DEFAULTS = ["BTCUSDT","ETHUSDT","SOLUSDT","BNBUSDT","XRPUSDT","DOGEUSDT","ADAUSDT","AVAXUSDT","LINKUSDT","SUIUSDT","ZECUSDT","1000PEPEUSDT","NEARUSDT","AAPLUSDT","HYPEUSDT","SOXLUSDT","ENAUSDT","XAUUSDT","TAOUSDT","AKEUSDT","CLUSDT","ARBUSDT","ONDOUSDT","SNDKUSDT","UNIUSDT","WLDUSDT","WIFUSDT","ZETAUSDT","FARTCOINUSDT","AAVEUSDT","PUMPFUNUSDT","LTCUSDT","MUBARAKUSDT","USELESSUSDT","XPLUSDT","PENGUUSDT","XAGUSDT","TRUMPUSDT","SPCXUSDT","XMRUSDT","XLMUSDT","MSTRUSDT","XAUTUSDT","HBARUSDT","VVVUSDT","BTWUSDT","APTUSDT","SKHYUSDT","CRCLUSDT","SKHYNIXUSDT","PONSUSDT","UAIUSDT","BCHUSDT","MUUSDT","INJUSDT","KORUUSDT","INTCUSDT","1000BONKUSDT","GRASSUSDT","SHIB1000USDT","SEIUSDT","ASTERUSDT","OPUSDT","LITUSDT","KERNELUSDT","DASHUSDT","SNXXUSDT","LSKUSDT","WLFIUSDT","MARSCOINUSDT","STRKUSDT","4STOCKUSDT","BZUSDT","VIRTUALUSDT","CRVUSDT","AEROUSDT","FILUSDT","ZAMAUSDT","SPXUSDT","DOTUSDT","CASHCATUSDT","FORMUSDT","ICPUSDT","NVDAUSDT","METAUSDT","SAMSUNGUSDT","BRUSDT","PHAUSDT","AIOZUSDT","SAGAUSDT","TIAUSDT","TRXUSDT","TSLAUSDT","MNTUSDT","JUPUSDT","DGAIUSDT","SOXSUSDT","ALGOUSDT","MONUSDT","FLOCKUSDT","PENDLEUSDT","JTOUSDT","GRAMUSDT","ETHFIUSDT","SKRUSDT","NILUSDT","DRAMUSDT","PTBUSDT","ATOMUSDT","COTIUSDT"];
const TFS = {"1H":"60","4H":"240"};
const CHUNK = 15;
let symbols = [];
function save(){ try{ localStorage.setItem("rsi_symbols", JSON.stringify(symbols)); localStorage.setItem("rsi_ver", VER); }catch(e){} }
try {
  const saved = JSON.parse(localStorage.getItem("rsi_symbols"));
  if (localStorage.getItem("rsi_ver") === VER && Array.isArray(saved) && saved.length) symbols = saved;
  else { symbols = [...DEFAULTS]; save(); }
}
catch(e){ symbols = [...DEFAULTS]; }

function toggleTheme(){
  const light = document.body.classList.toggle("light");
  try{ localStorage.setItem("rsi_theme", light ? "light" : "dark"); }catch(e){}
  syncIcon();
}
function syncIcon(){
  const light = document.body.classList.contains("light");
  document.getElementById("icoMoon").style.display = light ? "none" : "";
  document.getElementById("icoSun").style.display = light ? "" : "none";
}
syncIcon();

function fmt(p){
  p = Number(p);
  if(p >= 1000) return p.toLocaleString("en-US",{maximumFractionDigits:1});
  if(p >= 100) return p.toFixed(2);
  if(p >= 1) return p.toFixed(3);
  return p.toFixed(5);
}
function cls(r){
  if(r==null) return "ok";
  if(r>=70) return "ob"; if(r>=60) return "hot";
  if(r>40) return "ok"; if(r>30) return "cheap"; return "os";
}
function rsi(closes, period=14){
  if(closes.length < period+1) return null;
  let g=[], l=[];
  for(let i=1;i<closes.length;i++){ let c=closes[i]-closes[i-1]; g.push(Math.max(c,0)); l.push(Math.max(-c,0)); }
  let ag = g.slice(0,period).reduce((a,b)=>a+b,0)/period;
  let al = l.slice(0,period).reduce((a,b)=>a+b,0)/period;
  if(al===0) return 100;
  for(let i=period;i<g.length;i++){ ag=(ag*(period-1)+g[i])/period; al=(al*(period-1)+l[i])/period; }
  if(al===0) return 100;
  let rs=ag/al; return 100-(100/(1+rs));
}
async function fetchCloses(sym, interval){
  const urls = [
    `https://api.bybit.com/v5/market/kline?category=linear&symbol=${sym}&interval=${interval}&limit=50`,
    `https://api.bybit.com/v5/market/kline?category=spot&symbol=${sym}&interval=${interval}&limit=50`
  ];
  for(const u of urls){
    try{
      const r = await fetch(u); const j = await r.json();
      if(j.retCode===0 && j.result && j.result.list && j.result.list.length>14){
        const rev = [...j.result.list].reverse();
        return rev.map(x=>Number(x[4]));
      }
    }catch(e){}
  }
  return null;
}
async function loadOne(sym){
  const out = {sym, price:null, r:{}};
  const res = await Promise.all(Object.entries(TFS).map(async ([label, iv]) => [label, await fetchCloses(sym, iv)]));
  for(const [label, c] of res){
    if(c){ out.price = c[c.length-1]; out.r[label]=rsi(c,14); }
    else out.r[label]=null;
  }
  return out;
}
function render(items){
  const el = document.getElementById("list"); el.innerHTML="";
  items.forEach(o=>{
    const d=document.createElement("div"); d.className="card";
    const r1=o.r["1H"], r4=o.r["4H"];
    d.innerHTML =
      `<div class="row1"><span class="sym">${o.sym}</span>`+
      `<span class="price">${o.price!=null?fmt(o.price):"-"}</span>`+
      `<button class="del" onclick="delSym('${o.sym}')">×</button></div>`+
      `<div class="grid">`+
      `<div class="tf"><small>1H</small><b class="${cls(r1)}">${r1!=null?r1.toFixed(1):"-"}</b></div>`+
      `<div class="tf"><small>4H</small><b class="${cls(r4)}">${r4!=null?r4.toFixed(1):"-"}</b></div>`+
      `</div>`;
    el.appendChild(d);
  });
}
let runId = 0, timer = null, count = 60;
async function refresh(manual){
  const my = ++runId;
  const st = document.getElementById("status");
  st.innerHTML = "<span class='dot'></span>Yüklənir 0/" + symbols.length + "...";
  const items = [];
  for(let i = 0; i < symbols.length; i += CHUNK){
    const part = await Promise.all(symbols.slice(i, i + CHUNK).map(loadOne));
    if(my !== runId) return;
    items.push(...part);
    st.innerHTML = "<span class='dot'></span>Yüklənir " + Math.min(i + CHUNK, symbols.length) + "/" + symbols.length + "...";
  }
  render(items);
  const t = new Date().toLocaleString("az-AZ",{timeZone:"Asia/Baku"});
  st.innerHTML = `<span class='dot'></span>Son yeniləmə: ${t} • Növbəti: 60 saniyə`;
  count = 60;
  if(timer) clearInterval(timer);
  timer = setInterval(()=>{
    count--;
    if(count<=0){ refresh(false); }
    else st.innerHTML = `<span class='dot'></span>Son yeniləmə: ${t} • Növbəti: ${count} saniyə`;
  },1000);
}
function addSym(){
  const inp = document.getElementById("add");
  const v = inp.value.trim().toUpperCase().replace("/","").replace(" ","");
  if(!v) return;
  if(!symbols.includes(v)){ symbols.push(v); save(); }
  inp.value = "";
  refresh(true);
}
function delSym(s){ symbols=symbols.filter(x=>x!==s); save(); refresh(true); }
document.getElementById("add").addEventListener("keydown",e=>{ if(e.key==="Enter") addSym(); });
refresh(false);
</script>
</body>
</html>
