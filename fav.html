<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sevimlilər • RSI Panel</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0 auto; max-width: 640px; font-family: -apple-system, "Segoe UI", Arial, sans-serif; background: #EDF1F7; color: #0F1D38; padding: 12px 12px 28px; }
  .brand { background: linear-gradient(135deg, #0E1B3D, #2B4ACB); border-radius: 16px; padding: 14px; color: #fff; margin-bottom: 10px; }
  .brand-row { display: flex; align-items: center; gap: 10px; }
  .logo2 { width: 14px; height: 14px; border-radius: 4px; background: #BEF264; flex-shrink: 0; }
  .brand-t { font-size: 19px; font-weight: 700; }
  .brand-s { font-size: 12px; opacity: .75; margin-top: 2px; }
  .nav { display: flex; gap: 5px; margin: 10px 0; background: #fff; border: 1px solid #E2E8F0; border-radius: 14px; padding: 5px; }
  .nav a { flex: 1; text-align: center; padding: 9px 1px; border-radius: 10px; color: #0F1D38; text-decoration: none; font-size: 11px; font-weight: 600; }
  .nav a.on { background: #4F46E5; color: #fff; }
  #status { display: inline-block; font-size: 12px; color: #64748B; margin: 2px 0 8px; background: #fff; border: 1px solid #E2E8F0; border-radius: 20px; padding: 6px 12px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #EAB308; margin-right: 6px; }
  button.ghost { padding: 10px 14px; border-radius: 12px; background: #fff; border: 1px solid #E2E8F0; color: #0F1D38; font-size: 14px; font-weight: 600; width: 100%; }
  button:active { opacity: .7; }
  .row { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #E2E8F0; border-left: 4px solid #EAB308; border-radius: 14px; padding: 10px 8px 10px 12px; margin-bottom: 8px; margin-top: 8px; box-shadow: 0 1px 4px rgba(15,29,56,.06); }
  .rid { flex: 1; min-width: 0; font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  a.slink { color: inherit; text-decoration: none; }
  .mtag { font-size: 9px; font-weight: 700; color: #4F46E5; border: 1px solid #4F46E5; border-radius: 8px; padding: 1px 6px; vertical-align: 2px; margin-left: 4px; }
  .rprice { font-size: 12px; color: #64748B; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
  .rtf { min-width: 62px; text-align: center; background: #F1F5F9; border-radius: 10px; padding: 5px 4px; }
  .rtf small { font-size: 10px; color: #64748B; display: block; font-weight: 600; }
  .rtf b { font-size: 16px; font-variant-numeric: tabular-nums; }
  .rdel { background: transparent; border: 0; color: #EAB308; font-size: 18px; padding: 2px 6px; }
  .ob { color: #DC2626; } .hot { color: #EA8600; } .ok { color: #94A3B8; } .cheap { color: #4F46E5; } .os { color: #16A34A; }
  .empty { background: #fff; border: 1px solid #E2E8F0; border-radius: 14px; padding: 22px; text-align: center; color: #64748B; margin-top: 8px; }
  .foot { color: #64748B; font-size: 12px; margin-top: 14px; line-height: 1.6; text-align: center; }
  .vbadge { font-size: 10px; font-weight: 700; border-radius: 8px; padding: 2px 8px; }
  .v-BUY { background: #16A34A; color: #fff; }
  .v-SELL { background: #DC2626; color: #fff; }
  .v-NEYTRAL { background: #F1F5F9; color: #64748B; }
  .morebtn { background: transparent; border: 0; color: #4F46E5; font-size: 12px; font-weight: 700; padding: 2px 6px; }
  .morebox { display: none; background: #fff; border: 1px solid #E2E8F0; border-radius: 12px; padding: 8px 12px; margin: -4px 0 8px; }
  .morebox.open { column-count: 2; column-gap: 18px; }
  .morebox.open .mrow { break-inside: avoid; }
  .mrow { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; }
  .md-AL { color: #16A34A; font-weight: 700; }
  .md-SAT { color: #DC2626; font-weight: 700; }
  .md-NEYTRAL { color: #94A3B8; }
  body { background: #0B0E11 !important; color: #F2F5F0 !important; font-family: Inter, -apple-system, "Segoe UI", Arial, sans-serif !important; }
  h1 { color: #F2F5F0 !important; }
  .sub, .foot { color: #8A94A6 !important; }
  .foot { border-color: #232B38 !important; }
  .card { background: #12161C !important; border-color: #232B38 !important; }
  .nav a { background: #12161C !important; border-color: #2A3342 !important; color: #F2F5F0 !important; }
  .nav a.on { background: #F7B500 !important; border-color: #F7B500 !important; color: #111 !important; }
  input { background: #12161C !important; border-color: #2A3342 !important; color: #F2F5F0 !important; font-family: inherit; }
  button.ghost { background: #12161C !important; border-color: #2A3342 !important; color: #F2F5F0 !important; }
  .logo { background: #F7B500 !important; }
  a.slink { color: #F2F5F0 !important; }
  .price { color: #F7B500 !important; }
  .empty { background: #12161C !important; border-color: #232B38 !important; color: #8A94A6 !important; }
  #status { background: #12161C !important; border-color: #232B38 !important; color: #8A94A6 !important; }
  .dot { background: #16C784 !important; }
  .mtag { color: #F7B500 !important; border-color: #F7B500 !important; }
  .row1 .sym, .sym { color: #F2F5F0 !important; }
</style>
</head>
<body>
<div class="brand">
  <div class="brand-row">
    <span class="logo2"></span>
    <div>
      <div class="brand-t">Sevimlilər</div>
      <div class="brand-s">Saxladığın coinlər • canlı</div>
    </div>
  </div>
</div>
<div class="nav">
  <a href="index.html">Home</a>
  <a href="signals.html">Siqnallar</a>
  <a href="calendar.html">Təqvim</a>
  <a href="tactics.html">Taktikalar</a>
  <a href="skor.html">Skor</a>
  <a href="fav.html" class="on">Sevimli</a>
</div>
<div id="status"><span class="dot"></span>Yüklənir...</div>
<button class="ghost" onclick="refresh(true)">Yenilə</button>
<div id="list"></div>

<div class="foot">Home-da və Coin-də ★ bas — bura düşür • Tövsiyə deyil</div>

<script>
const TFS = {"1H":"60","4H":"240"};
const CHUNK = 15;
const MARKETS = {stock:["AAPLUSDT","NVDAUSDT","TSLAUSDT","METAUSDT","MSTRUSDT","INTCUSDT","MUUSDT","SNDKUSDT","SKHYNIXUSDT","SAMSUNGUSDT","SOXLUSDT","SOXSUSDT","GOOGLUSDT","AMZNUSDT","MSFTUSDT","QQQUSDT","DELLUSDT","MRVLUSDT","AVGOUSDT","PLTRUSDT","NBISUSDT","TQQQUSDT","EWYUSDT"], com:["XAUUSDT","XAGUSDT","XAUTUSDT","PAXGUSDT"]};
function marketOf(s){ if(MARKETS.stock.includes(s)) return "stock"; if(MARKETS.com.includes(s)) return "com"; return "crypto"; }
function getFavs(){ try{ return JSON.parse(localStorage.getItem("rsi_favs")) || []; }catch(e){ return []; } }
function saveFavs(f){ try{ localStorage.setItem("rsi_favs", JSON.stringify(f)); }catch(e){} }

function fmt(p){
  p = Number(p);
  if(p >= 1000) return p.toLocaleString("en-US",{maximumFractionDigits:1});
  if(p >= 100) return p.toFixed(2);
  if(p >= 1) return p.toFixed(3);
  return p.toFixed(5);
}
function cls(r){
  if(r==null) return "ok";
  if(r>=70) return "ob"; if(r>=60) return "hot";
  if(r>40) return "ok"; if(r>30) return "cheap"; return "os";
}
function rsi(closes, period=14){
  if(closes.length < period+1) return null;
  let g=[], l=[];
  for(let i=1;i<closes.length;i++){ let c=closes[i]-closes[i-1]; g.push(Math.max(c,0)); l.push(Math.max(-c,0)); }
  let ag = g.slice(0,period).reduce((a,b)=>a+b,0)/period;
  let al = l.slice(0,period).reduce((a,b)=>a+b,0)/period;
  if(al===0) return 100;
  for(let i=period;i<g.length;i++){ ag=(ag*(period-1)+g[i])/period; al=(al*(period-1)+l[i])/period; }
  if(al===0) return 100;
  let rs=ag/al; return 100-(100/(1+rs));
}
async function fetchFull(sym, interval){
  const urls = [
    `https://api.bybit.com/v5/market/kline?category=linear&symbol=${sym}&interval=${interval}&limit=50`,
    `https://api.bybit.com/v5/market/kline?category=spot&symbol=${sym}&interval=${interval}&limit=50`
  ];
  for(const u of urls){
    try{
      const r = await fetch(u); const j = await r.json();
      if(j.retCode===0 && j.result && j.result.list && j.result.list.length>25){
        const rev = [...j.result.list].reverse();
        return rev.map(x=>({c:Number(x[4]),h:Number(x[2]),l:Number(x[3])}));
      }
    }catch(e){}
  }
  return null;
}
function emaArr(src,p){
  const k=2/(p+1); const o=new Array(src.length).fill(null);
  let e=src.slice(0,p).reduce((a,b)=>a+b,0)/p; o[p-1]=e;
  for(let i=p;i<src.length;i++){e=src[i]*k+e*(1-k);o[i]=e;}
  return o;
}
function macdHist(c){
  const e12=emaArr(c,12), e26=emaArr(c,26);
  const mv=e12.map((v,i)=>v==null||e26[i]==null?null:v-e26[i]).filter(v=>v!=null);
  const se=emaArr(mv,9);
  return mv[mv.length-1]-se[se.length-1];
}
function pctBv(c){
  const s=c.slice(-20); const m=s.reduce((a,b)=>a+b,0)/20;
  const sd=Math.sqrt(s.reduce((a,b)=>a+(b-m)*(b-m),0)/20);
  return (c[c.length-1]-(m-2*sd))/(4*sd);
}
function miniVerdict(o){
  const k4=o.k4; if(!k4||!k4.length) return null;
  const c4=k4.map(x=>x.c);
  const r4=o.r["4H"]; if(r4==null) return null;
  const price=o.price;
  const e50=emaArr(c4,50).pop();
  const mh=macdHist(c4), pb=pctBv(c4);
  const L=[];
  const put=(id,d)=>L.push({id,d});
  put("T1", r4>=75?"SAT":r4<=20?"AL":"NEYTRAL");
  put("T2", r4>55?"AL":r4<45?"SAT":"NEYTRAL");
  put("T4", price>e50?"AL":price<e50?"SAT":"NEYTRAL");
  put("T6", mh>0?"AL":mh<0?"SAT":"NEYTRAL");
  put("T7", pb>0.8?"SAT":pb<0.2?"AL":"NEYTRAL");
  const al=L.filter(x=>x.d==="AL").length, sat=L.filter(x=>x.d==="SAT").length;
  return{al,sat,list:L,verdict:al-sat>=2?"BUY":sat-al>=2?"SELL":"NEYTRAL"};
}
async function loadOne(sym){
  const out = {sym, price:null, r:{}, v:null};
  const res = await Promise.all(Object.entries(TFS).map(async ([label, iv]) => [label, await fetchFull(sym, iv)]));
  for(const [label, k] of res){
    if(k){ const c=k.map(x=>x.c); out.price=c[c.length-1]; out.r[label]=rsi(c,14); out[label==="1H"?"k1":"k4"]=k; }
    else out.r[label]=null;
  }
  out.v = miniVerdict(out);
  return out;
}
function toggleMore(btn){
  const box = btn.closest(".mwrap").querySelector(".morebox");
  const open = box.style.display==="block";
  box.style.display = open?"none":"block";
  box.classList.toggle("open", !open);
  btn.textContent = open?"More +":"More −";
}
function render(items){
  const el = document.getElementById("list"); el.innerHTML="";
  if(!items.length){ el.innerHTML = `<div class="empty">Hələ sevimli yoxdur.<br>Home-da və ya Coin-də ★ bas.</div>`; return; }
  items.forEach(o=>{
    const d=document.createElement("div"); d.className="mwrap";
    const r1=o.r["1H"], r4=o.r["4H"];
    const m = marketOf(o.sym);
    const tag = m==="crypto" ? "" : `<span class="mtag">${m==="stock"?"STOCK":"ƏMTƏƏ"}</span>`;
    const v = o.v;
    const vb = v ? `<span class="vbadge v-${v.verdict}">${v.verdict} ${v.al}-${v.sat}</span>` : "";
    const mb = v ? `<div class="morebox">${v.list.map(x=>`<div class="mrow"><span>${x.id}</span><span class="md-${x.d}">${x.d==="NEYTRAL"?"GÖZLƏ":x.d}</span></div>`).join("")}<div class="mrow"><span></span><a class="slink" href="coin.html?symbol=${o.sym}" style="color:#4F46E5;font-weight:700;">Tam analiz →</a></div></div>` : "";
    d.innerHTML =
      `<div class="row"><div class="rid"><a class="slink" href="coin.html?symbol=${o.sym}">${o.sym}</a>${tag}<div class="rprice">${o.price!=null?fmt(o.price):"-"} ${vb} <button class="morebtn" onclick="toggleMore(this)">More +</button></div></div>`+
      `<div class="rtf"><small>1H</small><b class="${cls(r1)}">${r1!=null?r1.toFixed(0):"-"}</b></div>`+
      `<div class="rtf"><small>4H</small><b class="${cls(r4)}">${r4!=null?r4.toFixed(0):"-"}</b></div>`+
      `<button class="rdel" onclick="unfav('${o.sym}')">★</button></div>`+mb;
    el.appendChild(d);
  });
}
let runId = 0, timer = null, count = 60;
async function refresh(manual){
  const my = ++runId;
  const st = document.getElementById("status");
  const symbols = getFavs();
  if(!symbols.length){ st.innerHTML = "<span class='dot'></span>Boşdur"; render([]); return; }
  st.innerHTML = "<span class='dot'></span>Yüklənir 0/" + symbols.length + "...";
  const items = [];
  for(let i = 0; i < symbols.length; i += CHUNK){
    const part = await Promise.all(symbols.slice(i, i + CHUNK).map(loadOne));
    if(my !== runId) return;
    items.push(...part);
    st.innerHTML = "<span class='dot'></span>Yüklənir " + Math.min(i + CHUNK, symbols.length) + "/" + symbols.length + "...";
  }
  render(items);
  const t = new Date().toLocaleString("az-AZ",{timeZone:"Asia/Baku"});
  st.innerHTML = `<span class='dot'></span>Son yeniləmə: ${t} • Növbəti: 60 saniyə`;
  count = 60;
  if(timer) clearInterval(timer);
  timer = setInterval(()=>{
    count--;
    if(count<=0){ refresh(false); }
    else st.innerHTML = `<span class='dot'></span>Son yeniləmə: ${t} • Növbəti: ${count} saniyə`;
  },1000);
}
function unfav(s){ saveFavs(getFavs().filter(x=>x!==s)); refresh(true); }
refresh(false);
</script>
</body>
</html>
